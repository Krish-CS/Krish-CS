name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/krish-snake.svg?palette=github-dark&color_snake=#25D6CF&color_dots=#07111F,#12343B,#1BAEAB,#25D6CF,#F5C46E
            dist/krish-snake-gold.svg?palette=github-dark&color_snake=#F5C46E&color_dots=#07111F,#12343B,#1BAEAB,#25D6CF,#FFFFFF
      - name: Commit generated snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate Krish color contribution snake
          file_pattern: dist/*.svg

name: Generate 3D Profile

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Krish-CS
      - name: Commit generated profile graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate 3D profile contribution graph
          file_pattern: profile-3d-contrib/*.svg
